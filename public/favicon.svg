<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e14" />
      <stop offset="50%" stop-color="#050508" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Glass Specular Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC069" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E8642F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7A1610" stop-opacity="0.2" />
    </linearGradient>

    <!-- Brand Monogram Vibrant Gold-Orange Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0" />
      <stop offset="30%" stop-color="#FFC069" />
      <stop offset="70%" stop-color="#E8642F" />
      <stop offset="100%" stop-color="#9E1B15" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radial Core Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFC069" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#E8642F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Dark Squircle (Apple 64x64 style) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#spotlight)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Subtle Inner Specular Reflection -->
  <rect x="3.5" y="3.5" width="57" height="28" rx="14" fill="white" fill-opacity="0.03" />

  <!-- Glowing Geometric "G" Monogram -->
  <g filter="url(#glow)">
    <!-- Modern Bold Geometric G -->
    <path
      d="M44 24.5C41.8 19.5 36.8 16 31 16C22.7 16 16 22.7 16 31C16 39.3 22.7 46 31 46C38.2 46 44.2 41 45.6 34.2C45.9 32.8 44.8 31.5 43.4 31.5H31C29.6 31.5 28.5 32.6 28.5 34C28.5 35.4 29.6 36.5 31 36.5H38.5C36.8 39.8 33.2 41.5 29.5 41C24.8 40.4 21.1 36.6 20.6 31.9C19.9 25.8 24.6 20.5 30.7 20.5C34.2 20.5 37.3 22.1 39.3 24.6C40.2 25.7 41.8 25.9 42.9 25.1C43.5 24.6 43.8 24 44 24.5Z"
      fill="url(#goldGrad)"
    />

    <!-- Ambient Spark Dot / Live Core Indicator in G aperture -->
    <circle cx="43" cy="21" r="2.2" fill="#FFC069" />
    <circle cx="43" cy="21" r="1" fill="#FFFFFF" />
  </g>
</svg>